name: Bug Report
description: Report a reproducible PalmDesk problem.
body:
  - type: markdown
    attributes:
      value: |
        PalmDesk is experimental. Do not include device passwords, TURN credentials, or private window contents. For vulnerabilities, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PalmDesk version or commit
      placeholder: 0.0.1 or commit hash
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host environment and target application
      placeholder: macOS version, Apple Silicon or Intel, Codex / ChatGPT version
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller environment
      placeholder: Phone / computer model, OS and browser version
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Same computer
        - Same local network
        - Different networks
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
