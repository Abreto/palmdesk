name: Container Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish as an immutable image tag (for example, v0.0.8). Run on that tag.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless cosign signatures use the workflow's OIDC identity.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, backend]
    env:
      SERVICE: ${{ matrix.service }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check deployment adapter
        run: node --test containers/test/*.test.mjs
      - name: Prepare pinned sources and build context
        run: node containers/prepare.mjs "$RUNNER_TEMP/palmdesk-images"
      - name: Choose image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${REGISTRY_OWNER,,}/palmdesk-${SERVICE}"
          tags="$image:sha-${GITHUB_SHA}"
          publish=false
          version=
          if [ -n "$RELEASE_TAG" ]; then
            # The desktop release workflow dispatches this run on its new tag.
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
            version="${RELEASE_TAG#v}"
            tags="$tags,$image:$version"
            publish=true
          elif [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tags,$image:latest"
            publish=true
          fi
          {
            echo "name=$image"
            echo "tags=$tags"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to move a release tag
        if: steps.image.outputs.version != ''
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists. Release image tags are never moved."
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown' <<< "$output"; then
            echo "$output"
            exit 1
          fi
      - name: Build Linux x86_64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/palmdesk-images
          file: ${{ runner.temp }}/palmdesk-images/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          push: ${{ steps.image.outputs.publish == 'true' }}
          provenance: ${{ steps.image.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.image.outputs.publish == 'true' }}
      - name: Install cosign
        if: steps.image.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
