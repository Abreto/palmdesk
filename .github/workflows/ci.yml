name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Install dependencies for source checks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile desktop window helper
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: pnpm build:native
      - name: Run source smoke tests
        run: pnpm test:smoke
      # Interactive native smoke needs an unlocked desktop and runs manually;
      # see docs/LOCAL_DEVELOPMENT.md for the opt-in command.
      - run: pnpm typecheck
      - run: pnpm build:prod

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      # Unreachable advisories are listed in pnpm-workspace.yaml and
      # docs/OPEN_SOURCE_READINESS.md.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
