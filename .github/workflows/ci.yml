name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies for source checks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile desktop window helper
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: pnpm build:native
      - name: Run source smoke tests
        run: pnpm test:smoke
      # Interactive native smoke needs an unlocked desktop and runs manually;
      # see docs/LOCAL_DEVELOPMENT.md for the opt-in command.
      - run: pnpm typecheck
      - run: pnpm build:prod
