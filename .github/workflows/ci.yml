name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks whose result does not depend on the OS run once, on the oldest
  # Node.js release that package.json supports.
  check:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-node, which caches the store pnpm reports.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Install dependencies for source checks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run source smoke tests
        run: pnpm test:smoke
      - run: pnpm build:prod

  # Platform-specific tests, the native helper and the packaged app.
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile desktop window helper
        run: pnpm build:native
      # Includes the macOS- and Windows-only tests. Interactive native smoke
      # needs an unlocked desktop and runs manually; see
      # docs/LOCAL_DEVELOPMENT.md for the opt-in command.
      - name: Run source smoke tests
        run: pnpm test:smoke
      - name: Build the unpacked desktop app
        run: pnpm build:desktop
      # Loads the main window with network, capture and input disabled.
      - name: Launch the packaged app
        run: pnpm test:desktop

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      # Unreachable advisories are listed in pnpm-workspace.yaml and
      # docs/OPEN_SOURCE_READINESS.md.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
